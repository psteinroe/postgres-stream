name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Get latest release tag
        id: latest_release
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ steps.latest_release.outputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build_sink_images:
    name: Build ${{ matrix.sink }} Image
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - sink: elasticsearch
            feature: sink-elasticsearch
          - sink: gcp-pubsub
            feature: sink-gcp-pubsub
          - sink: kafka
            feature: sink-kafka
          - sink: kinesis
            feature: sink-kinesis
          - sink: meilisearch
            feature: sink-meilisearch
          - sink: nats
            feature: sink-nats
          - sink: rabbitmq
            feature: sink-rabbitmq
          - sink: redis-streams
            feature: sink-redis-streams
          - sink: redis-strings
            feature: sink-redis-strings
          - sink: sns
            feature: sink-sns
          - sink: sqs
            feature: sink-sqs
          - sink: webhook
            feature: sink-webhook
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            FEATURES=${{ matrix.feature }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.sink }}-latest
            ghcr.io/${{ github.repository }}:${{ matrix.sink }}-${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.sink }}
          cache-to: type=gha,mode=max,scope=${{ matrix.sink }}

  summary:
    name: Output Summary
    runs-on: ubuntu-latest
    needs: [prepare, build_sink_images]
    steps:
      - name: Output Summary
        run: |
          {
            echo "# 🚀 Docker Images Published!"
            echo ""
            echo "## Available Images"
            echo ""
            echo "| Sink | Image |"
            echo "|------|-------|"
            echo "| Elasticsearch | \`ghcr.io/${{ github.repository }}:elasticsearch-${{ needs.prepare.outputs.version }}\` |"
            echo "| GCP Pub/Sub | \`ghcr.io/${{ github.repository }}:gcp-pubsub-${{ needs.prepare.outputs.version }}\` |"
            echo "| Kafka | \`ghcr.io/${{ github.repository }}:kafka-${{ needs.prepare.outputs.version }}\` |"
            echo "| Kinesis | \`ghcr.io/${{ github.repository }}:kinesis-${{ needs.prepare.outputs.version }}\` |"
            echo "| Meilisearch | \`ghcr.io/${{ github.repository }}:meilisearch-${{ needs.prepare.outputs.version }}\` |"
            echo "| NATS | \`ghcr.io/${{ github.repository }}:nats-${{ needs.prepare.outputs.version }}\` |"
            echo "| RabbitMQ | \`ghcr.io/${{ github.repository }}:rabbitmq-${{ needs.prepare.outputs.version }}\` |"
            echo "| Redis Streams | \`ghcr.io/${{ github.repository }}:redis-streams-${{ needs.prepare.outputs.version }}\` |"
            echo "| Redis Strings | \`ghcr.io/${{ github.repository }}:redis-strings-${{ needs.prepare.outputs.version }}\` |"
            echo "| SNS | \`ghcr.io/${{ github.repository }}:sns-${{ needs.prepare.outputs.version }}\` |"
            echo "| SQS | \`ghcr.io/${{ github.repository }}:sqs-${{ needs.prepare.outputs.version }}\` |"
            echo "| Webhook | \`ghcr.io/${{ github.repository }}:webhook-${{ needs.prepare.outputs.version }}\` |"
            echo ""
            echo "## Pull an image"
            echo "\`\`\`bash"
            echo "docker pull ghcr.io/${{ github.repository }}:<sink>-${{ needs.prepare.outputs.version }}"
            echo "\`\`\`"
            echo ""
            echo "Or use latest:"
            echo "\`\`\`bash"
            echo "docker pull ghcr.io/${{ github.repository }}:<sink>-latest"
            echo "\`\`\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
